name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.repository == 'TxnLab/nfd-sdk'
    runs-on: ubuntu-latest

    steps:
      - name: Generate release token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Node 22 bundles npm 10.9.x, which predates OIDC trusted publishing, so
      # this step is required. Pin the major: npm@latest broke the release once
      # by raising its own Node floor past .nvmrc (npm 12 wants >= 22.22.2).
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          GIT_AUTHOR_NAME: TxnLab Release Bot[bot]
          GIT_AUTHOR_EMAIL: txnlab-release-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: TxnLab Release Bot[bot]
          GIT_COMMITTER_EMAIL: txnlab-release-bot[bot]@users.noreply.github.com
        run: npx semantic-release
